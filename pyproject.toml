[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "morphogenesis-ga"
version = "0.1.0"
description = "Neuroevolution platform for programmable morphogenesis via GA-trained neural controllers"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Morphogenesis-GA Team"},
]
dependencies = [
    "torch>=2.5",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "imageio>=2.30",
]

[project.optional-dependencies]
viz = [
    "pygame>=2.6",
    "matplotlib>=3.10",
]
tb = [
    "tensorboard>=2.18",
]
hpo = [
    "optuna>=4.0",
]
tracker = [
    "mlflow>=2.15",
]
dev = [
    "ruff>=0.15",
    "mypy>=1.20",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-benchmark>=5.0",
]
all = [
    "morphogenesis-ga[viz,tb,dev,hpo,tracker]",
]

[project.scripts]
morpho = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "golden: golden regression tests",
    "cuda: tests that require CUDA (skipped on CPU-only machines)",
]
