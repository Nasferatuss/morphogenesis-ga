name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ run_train.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyyaml numpy imageio pytest pytest-cov pytest-benchmark
      - name: Run tests
        run: pytest tests/ --cov=src --cov-report=term-missing -q
      - name: Smoke test
        run: python run_train.py --config configs/baseline_T.yaml --steps 0 --no-viz
