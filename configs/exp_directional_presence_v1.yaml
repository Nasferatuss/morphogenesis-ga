# Experiment: directional actions + stem_trunk_presence (binary)
# ============================================================================
# Closes Decision Doc 2026-04-19 Open Questions #1 and #2 simultaneously:
#   #1 — do ACTION_DIVIDE_N/S/E/W (bc0490a) beat 0.329 baseline?
#   #2 — is stem_trunk_presence=true under current code (b0dac9d) really at
#        MS-10 ~ 0.454, or was that an artefact of the binary-collapse bug?
#
# Base:         configs/exp_curriculum_v10_credit02.yaml
# Single diff:  fitness.stem_trunk_credit: 0.2  ->  fitness.stem_trunk_presence: true
# Baseline:     MS-10 = 0.329 (runs/champion_hpo_v1/best.pt, post-RNG-fix 1a10ac9)
# Success:      MS-10 best_iou mean > 0.349, reach>=0.30 for >= 8/10 seeds
# Hypothesis:   directional actions + binary trunk signal lift MS-10 by >= 0.02
#               because (a) binary presence is the only working mode per v6-v10
#               sweep, (b) directional divide first gives GA physical capacity
#               to build the vertical T trunk.
# ============================================================================
seed: 42
world:
  width: 15
  height: 15
  init_cells: 50
  steps: 250
target:
  name: "T"
model:
  embed_dim: 32
  heads: 4
  use_position: true
simulate:
  anti_extinction_warmup_steps: 25
  late_cleanup_start_frac: 0.6522
  die_cap_schedule:
    - until_step: 60
      cap_frac: 0.20
    - until_step: 130
      cap_frac: 0.40
    - until_step: 999999
      cap_frac: 0.35
viz:
  mode: pygame
  render_every_steps: 5
  cell_px: 28
  fps: 20
  gif:
    enabled: false
device:
  prefer: cuda
logging:
  run_name: exp_directional_presence_v1
ga:
  enabled: true
  population_size: 48
  generations: 246
  elite_frac: 0.285
  mutation_prob: 0.257
  mutation_std: 0.038
  n_elites_unchanged: 6
  eval_steps: 250
  viz_every_generations: 20
  checkpoint_every_generations: 20
  plateau_generations: 50
  plateau_min_delta: 0.002
  plateau_stop_entire_run: true
  plateau_patience_t: 90
  plateau_warmup_generations_T: 20
  stem_phase_cleanup_start_frac: 0.82
  stem_phase_cleanup_power: 1.3
  late_t_guard:
    enabled: true
    coverage_floor: 0.58
    trunk_floor: 0.42
    junction_floor: 0.4
    area_floor: 0.65
    penalty: 3.20
    iou_margin: 0.08
    cooldown_generations: 12
    area_weight: 1.1
    reinject_champion: true
    cleanliness_scale: 0.6
    alignment_floor: 0.46
    bar_floor: 0.42
    empty_area_floor: 0.24
    history_window: 28
    recent_window: 6
    min_viable_history: 6
    regression_drop_iou: 0.12
    regression_drop_coverage: 0.25
    regression_drop_area: 0.28
    regression_drop_trunk: 0.32
    regression_drop_junction: 0.3
    gate_strength: 1.1
    regression_gate_boost: 1.35
    champion_pool_size: 4
    reinject_fraction: 0.12
    reinject_max_slots: 5
    regression_mutation_cap: 0.0065
fitness:
  alpha_fp: 2.88
  beta_fn: 1.77
  gamma_area: 0.29
  stem_penalty_scale: 0.127
  stem_cleanup_multiplier: 1.5
  stem_corridor_start_scale: 2.0
  stem_corridor_end_scale: 1.1
  stem_trunk_presence: true     # v10: stem_trunk_credit=0.2 -> presence=true
  t_symmetry_weight: 0.05
  t_trunk_weight: 0.30
  late_t:
    start_frac: 0.65
    fp_multiplier: 1.2
    symmetry_weight: 0.02
    trunk_weight: 0.05
    clean_component_weight: 0.12
    clean_fp_weight: 0.08
curriculum:
  enabled: true
  phases:
    - name: "phase_cross"
      target: "cross"
      generations: 50
      log_key: "cross"
    - name: "phase_transition"
      target: "T"
      generations: 16
      blend_from_target: "cross"
      blend_to_target: "T"
      log_key: "transition"
    - name: "phase_T"
      target: "T"
      generations: 150
      log_key: "t"
    - name: "phase_T_refine"
      target: "T"
      generations: 30
      log_key: "t_refine"
